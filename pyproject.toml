[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noesis"
version = "0.1.0"
description = "A minimal, composable agent framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Noesis Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.21.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "uvicorn>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/noesis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

